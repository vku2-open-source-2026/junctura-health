name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check SPDX headers, license files and dependency hygiene
        run: npm run check
      - name: Install REUSE SPDX checker
        run: python -m pip install -r requirements-reuse.txt
      - name: Verify REUSE/SPDX license metadata
        run: npm run check:reuse
      - name: Install UI library dependencies
        run: npm --prefix ui ci
      - name: Typecheck, test (components, accessibility, contrast) and build the UI library
        run: |
          npm --prefix ui run typecheck
          npm --prefix ui test
          npm --prefix ui run build
      - name: Check out Junctura DX-OS for manifest conformance tests
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: vku2-open-source-2026/junctura-dxos
          ref: v0.1.0
          path: .junctura-dxos
          persist-credentials: false
      - name: Run tests
        env:
          JUNCTURA_DXOS_DIR: .junctura-dxos
        run: npm test
      - name: Check the contracts package contents (what npm would publish)
        run: |
          cp LICENSE NOTICE contracts/
          npm pack --dry-run --json --prefix contracts > pack.json
          node -e "const f=JSON.parse(require('fs').readFileSync('pack.json'))[0].files.map(x=>x.path);for(const need of ['index.mjs','index.d.ts','LICENSE','NOTICE','capabilities/allergy-list.json']){if(!f.includes(need)){console.error('missing from package: '+need);process.exit(1)}}console.log(f.length+' files in the package')"
          rm -f pack.json contracts/LICENSE contracts/NOTICE